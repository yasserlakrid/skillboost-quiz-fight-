[package]
name = "reflex-arena"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
tower-http = { version = "0.5", features = ["fs"] }
serde_json = "1"
rand = "0.8"
futures-util = "0.3"
